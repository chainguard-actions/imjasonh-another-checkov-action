name: Checkov Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.yaml'
      - '**.yml'
      - '**/Dockerfile'

permissions: {}

jobs:
  use-action:
    runs-on: ubuntu-latest
    name: Checkov Security Scan

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Need full history for git diff

      - uses: ./
        with:
          fail-on-error: false
